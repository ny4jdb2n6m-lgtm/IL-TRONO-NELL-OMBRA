function normalize(source){const base=emptyDatabase();if(!source||typeof source!=='object'||!Array.isArray(source.arcs))throw new Error('Archivio non valido');return {...base,...source,meta:{...base.meta,...source.meta},settings:{...base.settings,...source.settings},combat:{...base.combat,...source.combat},graph:{...base.graph,...(source.graph&&typeof source.graph==='object'?source.graph:{}),positions:(source.graph&&source.graph.positions&&typeof source.graph.positions==='object'&&!Array.isArray(source.graph.positions))?source.graph.positions:{},links:Array.isArray(source.graph?.links)?source.graph.links.filter(x=>x&&typeof x.from==='string'&&typeof x.to==='string'):[],hiddenNodes:Array.isArray(source.graph?.hiddenNodes)?source.graph.hiddenNodes.filter(x=>typeof x==='string'):[]},...Object.fromEntries([...listSections].map(k=>[k,Array.isArray(source[k])?source[k]:base[k]]))}}

function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderDashboard(){const played=db.sessions.filter(s=>s.status==='Giocata').length,done=db.arcs.filter(a=>a.status==='Completato').length,open=db.quests.filter(q=>q.status==='In corso').length,pending=db.clues.filter(q=>q.status==='Da scoprire').length;let future=db.sessions.filter(s=>s.status!=='Giocata').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `

function mainFieldKey(k){return ({pcs:'name',npcs:'name',places:'name',factions:'name',sessions:'title',quests:'title',clues:'title',encounters:'title',loot:'name',timeline:'title',notes:'title',arcs:'title'})[k]}
function renderList(key){const conf=SCHEMAS[key];const q=query.toLowerCase().trim();let items=db[key].filter(x=>!q||Object.values(x).some(y=>typeof y==='string'&&y.toLowerCase().includes(q)));if(filter!=='all')items=items.filter(x=>x.status===filter||x.arc===filter||x.kind===filter);if(key==='sessions')items.sort((a,b)=>(Number(b.number)||0)-(Number(a.number)||0));const statusChoices=[...new Set(db[key].map(x=>x.status).filter(Boolean))];return pageHead(conf.title,conf.subtitle,btn('＋ Aggiungi',`openForm('${key}')`,'btn-primary')+btn('▤ Stampa',`printSection('${key}')`))+`<div class="searchline"><input type="search" id="qinput" class="searchinput" placeholder="Cerca in ${esc(conf.title.toLowerCase())}…" value="${esc(query)}" oninput="updateSearch(this.value)" aria-label="Cerca"><select style="max-width:200px" onchange="changeFilter(this.value)" aria-label="Filtro"><option value="all">Tutti</option>${statusChoices.map(s=>`<option ${filter===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select></div><div class="small muted" style="margin-bottom:10px">${items.length} ${items.length===1?'elemento':'elementi'}</div>${items.length?`<div class="record-grid">${items.map(x=>renderRecordCard(key,x)).join('')}</div>`:`<div class="empty"><div class="symbol">◇</div><h2>Nessun elemento trovato</h2><p>${db[key].length?'Modifica la ricerca oppure il filtro.':'Questo archivio è pronto per le tue schede.'}</p>${btn('＋ Aggiungi',`openForm('${key}')`,'btn-primary')}</div>`}`}

function inputHtml(f,v=''){const id=`fld-${f.key}`,required=f.required?'required':'',value=esc(v),place=f.secret?'Le informazioni riservate non vengono mostrate nella vista giocatori':'';let input;if(f.type==='textarea')input=`<textarea id="${id}" name="${f.key}" ${required} rows="4" placeholder="${place}">${value}</textarea>`;else if(f.type==='arc')input=`<select id="${id}" name="${f.key}"><option value="">— Seleziona —</option>${db.arcs.map(a=>`<option value="${esc(a.id)}" ${v===a.id?'selected':''}>${esc(a.title)}</option>`).join('')}</select>`;else if(f.type==='status'||f.type==='options'){const values=f.type==='status'?statusOptions:f.options||[];input=`<select id="${id}" name="${f.key}"><option value="">— Seleziona —</option>${values.map(t=>`<option value="${esc(t)}" ${t===v?'selected':''}>${esc(t)}</option>`).join('')}</select>`}else input=`<input id="${id}" name="${f.key}" type="${f.type}" value="${value}" ${required} ${f.type==='number'?'step="1"':''}>`;return `<label class="${f.wide?'full':''}" for="${id}">${esc(f.label)}${f.secret?' 🔒':''}${input}</label>`}
function openForm(key,id=null){const obj=id?db[key].find(x=>x.id===id):null;if(id&&!obj)return showToast('Scheda non trovata',true);editingId=id;editingSection=key;const conf=SCHEMAS[key];document.getElementById('modalRoot').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(conf.singular)}"><div class="modal-top"><div><div class="eyebrow">${id?'Modifica':'Nuova scheda'}</div><h2>${esc(conf.singular)}</h2></div><button class="btn btn-icon" onclick="closeModal()" aria-label="Chiudi">✕</button></div><form id="recordForm" onsubmit="saveRecord(event)"><div class="form-grid">${conf.fields.map(f=>inputHtml(f,obj?.[f.key]??'')).join('')}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button type="submit" class="btn btn-primary">Salva scheda</button></div></form></div></div>`;const first=document.querySelector('#recordForm input');first?.focus()}

function saveRecord(e){e.preventDefault();const key=editingSection;if(!SCHEMAS[key])return;const form=new FormData(e.currentTarget),vals={};for(const f of SCHEMAS[key].fields){let v=(form.get(f.key)||'').toString().trim();vals[f.key]=f.type==='number'?(v===''?'':Number(v)):v}const idx=editingId?db[key].findIndex(x=>x.id===editingId):-1;if(idx>=0) db[key][idx]={...db[key][idx],...vals};else db[key].push({id:makeId(),...vals});persist();closeModal();render();showToast('Scheda salvata sul dispositivo')}
function deleteRecord(key,id){const row=db[key]?.find(x=>x.id===id);if(!row)return;if(key==='arcs'&&arcValues.includes(id))return showToast('Gli archi principali si modificano ma non si eliminano.',true);const related=key==='arcs'?[...listSections].filter(k=>k!=='arcs').reduce((tot,k)=>tot+db[k].filter(x=>x.arc===id).length,0):0;const msg=`Eliminare «${row[mainFieldKey(key)]||'questa scheda'}»?${related?' ATTENZIONE: '+related+' schede fanno riferimento a questo arco e resteranno senza collegamento.':''}\n\nLa cancellazione non è annullabile; scarica prima un backup se necessario.`;if(!confirm(msg))return;db[key]=db[key].filter(x=>x.id!==id);if(db.graph){const k=key+':'+id;db.graph.links=db.graph.links.filter(l=>l.from!==k&&l.to!==k);db.graph.hiddenNodes=db.graph.hiddenNodes.filter(v=>v!==k);delete db.graph.positions[k]}persist();render();showToast('Scheda eliminata')}
function renderCombat(){const c=db.combat, combatants=[...c.combatants].sort((a,b)=>(Number(b.init)||0)-(Number(a.init)||0)),active=combatants[c.turn%Math.max(combatants.length,1)];return pageHead('Schermo combattimento','Ordine di iniziativa, turni, round, PF e condizioni. I dati restano salvati anche chiudendo l’app.',btn('＋ Partecipante',"addCombatant()",'btn-primary')+btn('▤ Stampa',"printSection('combat')"))+`<div class="roundbox"><div><div class="eyebrow" style="color:#cfba8b">${esc(c.name||'Incontro senza titolo')}</div><div class="round">Round ${Number(c.round)||1}</div><div class="small darkhint">${active?'Turno di '+esc(active.name):'Aggiungi i combattenti per iniziare'}</div></div><div class="buttonbar">${btn('＋ Round',"nextRound()")}${btn('→ Turno successivo',"nextTurn()",'btn-gold')}${btn('↺ Ripristina',"resetCombat()",'btn-danger')}</div></div><div style="height:15px"></div><div class="panel padded"><div class="grid cols2" style="margin-bottom:16px"><label>Nome dello scontro<input type="text" value="${esc(c.name)}" onchange="db.combat.name=this.value;persist()"></label><label>Carica i PG esistenti<select id="loadpc"><option value="">Scegli un personaggio…</option>${db.pcs.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><button style="margin-top:5px" class="btn btn-small" onclick="importPcToCombat()">Aggiungi PG</button></label></div>${combatants.length?`<div class="small muted" style="margin-bottom:8px">ORDINE DI INIZIATIVA (dal valore maggiore al minore)</div><div>${combatants.map((x,i)=>`<div class="combatant ${i===c.turn%combatants.length?'active':''}"><div class="name">${i===c.turn%combatants.length?'▶ ':''}${esc(x.name)}</div><label class="micro">Iniz.<input type="number" value="${esc(x.init)}" onchange="updateCombatant('${x.id}','init',this.value)"></label><label class="micro">PF<input type="number" value="${esc(x.hp)}" onchange="updateCombatant('${x.id}','hp',this.value)"></label><label class="cond micro">Condizione<input type="text" value="${esc(x.condition||'')}" onchange="updateCombatant('${x.id}','condition',this.value)"></label><button class="btn btn-small btn-danger rm" onclick="removeCombatant('${x.id}')">✕</button></div>`).join('')}</div>`:`<div class="empty"><div class="symbol">⚔</div><h2>Nessun combattente</h2><p>Inserisci un nome e l'iniziativa oppure carica un personaggio dall’archivio.</p>${btn('＋ Aggiungi combattente',"addCombatant()",'btn-primary')}</div>`}</div><div style="height:16px"></div><div class="note">Le regole d'iniziativa e i PF vengono registrati manualmente: questo pannello è un tracker, non un arbitro automatico delle regole D&D 2024.</div>`}
function addCombatant(){const name=prompt('Nome del combattente (PG o creatura):');if(name===null||!name.trim())return;const ini=prompt('Iniziativa (numero):','10');if(ini===null)return;const hp=prompt('Punti ferita attuali (numero):','10');if(hp===null)return;db.combat.combatants.push({id:makeId(),name:name.trim(),init:Number(ini)||0,hp:Number(hp)||0,condition:''});db.combat.turn=0;persist();render()}

function removeCombatant(id){db.combat.combatants=db.combat.combatants.filter(x=>x.id!==id);db.combat.turn=0;persist();render()}
function nextTurn(){const n=db.combat.combatants.length;if(!n)return;if(db.combat.turn>=n-1){db.combat.turn=0;db.combat.round=(Number(db.combat.round)||1)+1}else db.combat.turn++;persist();render()}
function nextRound(){db.combat.round=(Number(db.combat.round)||1)+1;db.combat.turn=0;persist();render()}
function resetCombat(){if(!confirm('Svuotare tutto il combattimento attuale?'))return;db.combat={name:'',round:1,turn:0,combatants:[]};persist();render()}

function graphPointerCancel(e){if(graphUI.pointer?.id===e.pointerId){if(graphUI.pointer.kind==='node')persist();graphUI.pointer=null}}
function graphWheel(e){e.preventDefault();const svg=document.getElementById('graphSvg');if(!svg)return;const p=graphWorldCoords(e);graphZoom(Math.exp(Math.sign(e.deltaY)*.13),p.x,p.y)}
function printGraph(){const nodes=visibleGraphNodes(),map=new Map(nodes.map(n=>[n.id,n])),links=graphEdges(nodes);const rows=links.map(l=>{const a=map.get(l.from),b=map.get(l.to);return `<div class="graph-print-row"><b>${esc(a?.label||'')}</b> → <b>${esc(b?.label||'')}</b> · ${esc(l.label||'Collegamento')}${l.secret?' · RISERVATO DM':''}</div>`}).join('');
 const before=graphUI.camera;fitGraph();const svg=document.getElementById('graphSvg');const graph=svg?svg.outerHTML.replace(/id="graphSvg"/,'id="printGraphSvg"').replace(/onpointer\w+="[^"]*"/g,'').replace(/onwheel="[^"]*"/g,''):'';graphUI.camera=before;refreshGraphCanvas();
 return runPrint('Mappa investigativa',`<p>${nodes.length} elementi · ${links.length} collegamenti · ${db.settings.dmMode?'Vista DM':'Vista giocatori'}</p><div class="graph-print-map">${graph}</div><h2>Collegamenti</h2>${rows||'<p>Nessun collegamento visibile.</p>'}`)}

function renderTools(){return pageHead('Stampa e backup','Proteggi il tuo archivio e prepara fascicoli da usare al tavolo. Le stampe sono in A4 verticale.')+`<div class="grid cols2"><div class="panel padded"><h2>Copie di sicurezza</h2><p class="muted small">Il backup JSON contiene tutti i dati, inclusi i segreti del DM. Trasferiscilo con un cavo, AirDrop o un metodo di tua scelta: non serve un server.</p><div class="buttonbar">${btn('⇩ Esporta archivio JSON','downloadBackup()','btn-primary')}${btn('⇧ Importa / ripristina','openRestorePicker()')}</div><div class="rule"></div><div class="small muted">Ultimo backup registrato: ${db.settings.lastBackup?humanDate(db.settings.lastBackup.slice(0,10)):'nessuno'}</div></div><div class="panel padded"><h2>Stampe A4 verticali</h2><p class="muted small">Seleziona un registro: le schede vengono ripartite su più pagine, evitando tabelle troppo larghe.</p><label>Documento<select id="printSectionInput"><option value="dashboard">Riepilogo della campagna</option><option value="graph">Mappa investigativa e collegamenti</option><option value="combat">Turni e combattimento</option>${listSections.map(k=>`<option value="${k}">${esc(SCHEMAS[k].title)}</option>`).join('')}</select></label><label class="check" style="margin:12px 0"><input type="checkbox" id="printSecret" ${db.settings.dmMode?'checked':''}> Includi i segreti del DM (solo per uso privato)</label>${btn('▤ Stampa / salva PDF',"printSelected()",'btn-primary')}</div><div class="panel padded"><h2>Esportazione CSV</h2><p class="muted small">Esporta le tabelle per consultarle o modificarle in Excel. I CSV contengono anche i campi riservati.</p><label>Archivio<select id="csvSection">${listSections.map(k=>`<option value="${k}">${esc(SCHEMAS[k].title)}</option>`).join('')}</select></label><div style="height:12px"></div>${btn('⇩ Scarica CSV',"exportCsv()")}</div><div class="panel padded"><h2>Trasferire i dati</h2><p class="small">1. Crea un backup JSON dal dispositivo principale.<br>2. Trasferisci il file su PC, Android o iPhone.<br>3. Nell’altra installazione apri «Importa / ripristina».<br>4. Controlla i dati prima di eliminare il backup.</p><div class="note">Il ripristino <b>sostituisce</b> l'archivio presente sul dispositivo di destinazione: non combina due modifiche divergenti.</div></div></div>`}
function renderSettings(){const m=db.meta;return pageHead('Impostazioni campagna','Personalizza l’ambientazione e gestisci gli archivi locali.')+`<div class="grid cols2"><div class="panel padded"><h2>Dettagli della campagna</h2><form id="settingsForm" onsubmit="saveSettings(event)"><div class="form-grid"><label class="full">Titolo<input name="title" value="${esc(m.title)}" required></label><label>Ambientazione<input name="setting" value="${esc(m.setting)}"></label><label>Regolamento<input name="rules" value="${esc(m.rules)}"></label><label>Intervallo livelli<input name="levelRange" value="${esc(m.levelRange)}"></label><label>Livello attuale del gruppo<input name="partyLevel" type="number" min="1" max="30" value="${esc(m.partyLevel)}"></label><label class="full">Arco attuale<select name="currentArc">${db.arcs.map(a=>`<option value="${esc(a.id)}" ${m.currentArc===a.id?'selected':''}>${esc(a.title)}</option>`).join('')}</select></label><label class="full">Descrizione<textarea name="description">${esc(m.description)}</textarea></label></div><div style="height:15px"></div><button type="submit" class="btn btn-primary">Salva impostazioni</button></form></div><div class="panel padded"><h2>Gestione e riservatezza</h2><p class="small muted">Vista giocatori: nasconde il contenuto dei campi riservati dall'interfaccia, ma <b>non</b> protegge i file da accessi non autorizzati. Non è un sistema di login.</p>${btn(db.settings.dmMode?'Passa alla vista giocatori':'Torna alla vista DM','togglePlayerMode()')}<div class="rule"></div><h3>Azzeramento archivio</h3><p class="small muted">Prima di cancellare tutto, crea una copia JSON. Questa operazione rimuove schede, sessioni e dati locali dell'app.</p>${btn('✕ Cancella tutti i dati','clearAllData()','btn-danger')}</div></div>`}
function saveSettings(e){e.preventDefault();const data=new FormData(e.currentTarget);for(const key of ['title','setting','rules','levelRange','description','currentArc'])db.meta[key]=String(data.get(key)||'');db.meta.partyLevel=Number(data.get('partyLevel'))||1;persist();render();showToast('Impostazioni aggiornate')}
function clearAllData(){if(!confirm('Vuoi eliminare TUTTO l’archivio locale? L’operazione è irreversibile se non hai un backup JSON.'))return;if(!confirm('Conferma definitiva: cancellare sessioni, personaggi, note, combattimenti e segreti?'))return;db=emptyDatabase();persist();go('dashboard');showToast('Archivio azzerato; ricreati soltanto gli archi base e Aldren Vhalor')}
function saveBlob(filename,content,type='application/octet-stream'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadBackup(){db.settings.lastBackup=new Date().toISOString();persist();const stamp=new Date().toISOString().slice(0,10);saveBlob(`Trono_nell_Ombra_BACKUP_${stamp}.json`,JSON.stringify(db,null,2),'application/json');showToast('Backup JSON generato: conservalo in un posto sicuro')}
function openRestorePicker(){document.getElementById('restoreFile').click()}
async function readBackup(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const raw=await f.text(),loaded=JSON.parse(raw),valid=normalize(loaded);if(!confirm(`Ripristinare l'archivio da «${f.name}»?\n\nTutti i dati di questa installazione saranno SOSTITUITI. Esporta prima un backup se vuoi conservarli.`))return;db=valid;persist();go('dashboard');showToast('Archivio ripristinato correttamente')}catch(err){console.error(err);showToast('File JSON non valido o incompatibile: ripristino non eseguito.',true)}}
function exportCsv(){const key=document.getElementById('csvSection')?.value;if(!SCHEMAS[key])return;const fields=SCHEMAS[key].fields,headers=fields.map(f=>f.label),records=db[key].map(row=>fields.map(f=>row[f.key]??''));let encode=cell=>'"'+String(cell??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[headers,...records].map(r=>r.map(encode).join(';')).join('\r\n');saveBlob(`Trono_nell_Ombra_${key}.csv`,csv,'text/csv;charset=utf-8')}
function printSelected(){const key=document.getElementById('printSectionInput').value,withSecrets=document.getElementById('printSecret').checked;printSection(key,withSecrets)}
function printSection(key,withSecrets=false){if(key==='graph')return printGraph();if(key==='dashboard'){const cards=[{t:'Ambientazione',v:db.meta.setting},{t:'Sistema',v:db.meta.rules},{t:'Livelli previsti',v:db.meta.levelRange},{t:'Livello del gruppo',v:db.meta.partyLevel},{t:'Sessioni giocate',v:db.sessions.filter(x=>x.status==='Giocata').length},{t:'Personaggi giocanti',v:db.pcs.length}];const data='<table>'+cards.map(x=>`<tr><th>${esc(x.t)}</th><td>${esc(x.v)}</td></tr>`).join('')+'</table><h2>Archi narrativi</h2>'+db.arcs.map(a=>`<div class="printed-card"><h3>${esc(a.title)} — ${esc(a.status)}</h3><div>Livelli: ${esc(a.levels)} · ${esc(a.fragment)}</div></div>`).join('');return runPrint('Riepilogo della campagna',data)}if(key==='combat'){const c=db.combat,items=[...c.combatants].sort((a,b)=>Number(b.init)-Number(a.init));return runPrint('Tracciamento combattimento',`<h2>${esc(c.name||'Incontro')}</h2><p>Round ${esc(c.round)}</p><table><tr><th>Combattente</th><td><b>Iniziativa / PF / Condizione</b></td></tr>${items.map(x=>`<tr><th>${esc(x.name)}</th><td>${esc(x.init)} / ${esc(x.hp)} / ${esc(x.condition)}</td></tr>`).join('')}</table>`)}if(!SCHEMAS[key])return;const schema=SCHEMAS[key];return runPrint(schema.title,db[key].map(row=>printRecord(schema,row,withSecrets)).join('')||'<p>Archivio vuoto.</p>')}
function printSingle(key,id){const row=db[key]?.find(x=>x.id===id);if(!row)return;return runPrint(SCHEMAS[key].singular,printRecord(SCHEMAS[key],row,db.settings.dmMode))}
function printRecord(schema,row,withSecrets){const main=mainFieldKey(Object.keys(SCHEMAS).find(k=>SCHEMAS[k]===schema));let fields=schema.fields.filter(f=>!(f.secret&&!withSecrets));return `<div class="printed-card"><h3>${esc(row[main]||'Scheda')}</h3><table>${fields.filter(f=>row[f.key]!==undefined&&row[f.key]!==null&&row[f.key]!=='').map(f=>`<tr><th>${esc(f.label)}</th><td>${textLines(f.key==='arc'?arcLabel(row[f.key]):row[f.key])}</td></tr>`).join('')}</table></div>`}
function runPrint(title,content){const stamp=new Date().toLocaleDateString('it-IT');document.getElementById('printMount').innerHTML=`<div class="printhead"><div style="text-transform:uppercase;letter-spacing:2px;font-size:8pt;color:#94794d">Il Trono nell'Ombra · Archivio del Dungeon Master</div><h1>${esc(title)}</h1><div class="printsub">${esc(db.meta.setting)} · ${esc(db.meta.rules)} · Stampa del ${esc(stamp)}</div></div>${content}<div class="printfoot">Documento ad uso del Dungeon Master · Generato con il gestionale offline · A4 verticale</div>`;window.print()}
window.addEventListener('afterprint',()=>document.getElementById('printMount').innerHTML='');
document.addEventListener('click',e=>{const node=e.target.closest('[data-nav]');if(node)go(node.dataset.nav)});
db=loadDatabase();render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW',e)))}
</script>
</body></html>
